project:
  name: "ForensicVision-X"
  version: "0.1.0"
  seed: 42

data:
  image_size: 224

  classes:
    real: 0
    ai_generated: 1
    manipulated: 2

  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".webp"

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  num_workers: 2

compression:
  quality_levels:
    - 95
    - 80
    - 60
    - 40
    - 20
    - 10

model:
  backbone: "resnet50"
  pretrained: true
  num_classes: 3

reproducibility:
  seed: 42
